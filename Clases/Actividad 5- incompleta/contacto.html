<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicosofia</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./icon.webp" type="image/x-icon">
</head>

<body>
    <header>
        <a href="./index.html" aria-label="link inicio">
            <img src="./icon.webp" alt="logo huellitas">
            <p>Psicosofia</p>
        </a>
        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Formulario de contacto</h2>
            <form action="contacto.html">
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre">
                <label for="correo">Correo</label>

                <input type="email" name="correo" id="correo">
                <label for="telefono">Telefono</label>

                <input type="tel" name="telefono" id="telefono">
                <label for="servicio">Servicio</label>

                <select name="servicio" id="servicio">
                    <option value="psico">Piscoterapia</option>
                    <option value="estres">Manejo del estres</option>
                    <option value="bienestar">Talleres de bienestar</option>
                </select>
                <label for="consulta">Motivo de consulta</label>

                <textarea name="consulta" id="consulta"></textarea>

                <button type="submit"></button>
            </form>
        </section>
    </main>
    <footer>
        <ul>
            <li>
                <p>
                    2026 Licenciada Sofía Martínez. Todos los derechos reservados.
                </p>
            </li>

            <li>
                <a href="./index.html">Inicio</a>

            </li>
            <li>
                <a href="./contacto.html">Contacto</a>
            </li>

            <li>
                <p>
                    Correo electrónico: contacto@sofiamartinez-psicologia.com
                </p>
            </li>
            <li>
                <p>

                    Atención online y presencial (Ciudad de Córdoba, Argentina) </p>
            </li>
        </ul>

    </footer>
</body>

</html>
