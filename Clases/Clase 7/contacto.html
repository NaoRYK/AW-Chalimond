<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas - Contacto</title>
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <header>
        <a href="./index.html" aria-label="link inicio">
            <img src="./resources/images/dog_animal_pet_bulldog_icon_124662.png" alt="logo huellitas">
        </a>
        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./catalogo.html">Catalogo</a>

            <a href="./contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <h1>Contacto</h1>

        <form action="./contacto.html" method="get">
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" >
            <label for="telefono">Telefono</label>
            <input type="number" name="telefono" id="telefono">
            <label for="descripcion">Descripcion</label>
            <label for="tipo-mascota">Tipo de mascota</label>
            <select name="tipo-mascota" id="tipo-mascota">
                <option value="perro">Perro</option>
                <option value="gato">Gato</option>
            </select>
            <textarea name="descripcion" id="descripcion"></textarea>

            <button type="submit">Enviar</button>
        </form>
        <h2>Mapa</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6809.455664878401!2d-64.18549255488762!3d-31.42162395719069!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a32dcf5d747f%3A0x40373220b29140ac!2sPatio%20Olmos%20Shopping!5e0!3m2!1ses!2sar!4v1788179926472!5m2!1ses!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>
    <footer>
        <ul>
            <li><a href="https://www.instagram.com/agusfzarate" target="_blank">
                Servicios de limpieza
            </a></li>
        </ul>
        
    </footer>
</body>
</html>
